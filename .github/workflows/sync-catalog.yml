# Полная синхронизация каталога мини-приложений.
name: sync-catalog
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [app-release]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Собрать catalog.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ] && [ -n "${{ github.event.client_payload.repo }}" ]; then
            node scripts/apply-release.mjs "${{ github.event.client_payload.repo }}"
          else
            node scripts/sync-catalog.mjs
          fi
      - name: Проверить каталог
        run: |
          node -e "
            const c = require('./catalog.json');
            if (!Array.isArray(c.apps)) throw new Error('apps не массив');
            for (const a of c.apps) {
              for (const k of ['id','name','version','url']) if (!a[k]) throw new Error('нет ' + k + ' в ' + a.id);
            }
            console.log('ok', c.apps.length);"
      - name: Коммит
        run: |
          git config user.name "miniapphub-bot"
          git config user.email "bot@users.noreply.github.com"
          git add catalog.json
          git diff --cached --quiet || (git commit -m "catalog: синхронизация $(date -u +%F)" && git push)
