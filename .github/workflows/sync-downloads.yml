# Пересобирает раздел скачиваний по последним релизам оболочек.
name: sync-downloads
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [shell-release]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Скачать установщики и обновить метаданные
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-downloads.mjs
      - name: Проверить метаданные
        run: |
          node -e "
            const fs = require('fs');
            for (const c of ['appshell-mobile','appshell-desktop']) {
              const p = 'downloads/' + c + '.json';
              if (!fs.existsSync(p)) throw new Error('нет ' + p);
              const d = JSON.parse(fs.readFileSync(p, 'utf8'));
              if (!('version' in d)) throw new Error('нет version в ' + p);
              console.log(c, d.version, d.file);
            }"
      - name: Коммит
        run: |
          git config user.name "miniapphub-bot"
          git config user.email "bot@users.noreply.github.com"
          git add downloads catalog.json
          git diff --cached --quiet || (git commit -m "downloads: обновление из релизов оболочек" && git push)
