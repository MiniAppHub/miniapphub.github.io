# Приём версий мини-приложений. Портал не опрашивает репозитории: мини-приложение присылает
# упрощённый манифест событием app-release, здесь — запись в catalog.json.
# История версий оболочек пишется из репозиториев оболочек (release-portal.yml).
name: portal-update

on:
  repository_dispatch:
    types: [app-release]
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON-данные (те же, что присылает репозиторий)'
        required: true

permissions:
  contents: write

concurrency:
  group: portal-update
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Записать версию мини-приложения
        env:
          PAYLOAD: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload) || inputs.payload }}
        run: node scripts/apply-app-release.mjs

      - name: Проверить catalog.json
        run: node -e "JSON.parse(require('fs').readFileSync('catalog.json', 'utf8'))"

      - name: Коммит
        run: |
          git config user.name "MiniAppHub"
          git config user.email "bot@users.noreply.github.com"
          git add catalog.json
          git diff --cached --quiet || (git commit -m "portal: app-release $(date -u +%F)" && git push)
