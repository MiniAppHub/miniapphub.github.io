<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniAppHub — каталог мини-приложений</title>
<style>
  :root{--bg:#0b0d10;--card:#14171c;--line:#222730;--text:#e7eaf0;--muted:#8a93a3;--accent:#5b8cff;--r:14px}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
  header{padding:48px 24px 24px;max-width:1080px;margin:auto}
  h1{margin:0 0 8px;font-size:28px;letter-spacing:-.02em}
  header p{margin:0;color:var(--muted)}
  main{max-width:1080px;margin:auto;padding:0 24px 64px}
  .search{width:100%;padding:12px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;margin:16px 0 24px;outline:none}
  .search:focus{border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .app{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;transition:border-color .15s}
  .app:hover{border-color:var(--accent)}
  .top{display:flex;align-items:center;gap:12px}
  .ico{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#5b8cff,#8b5cf6);display:grid;place-items:center;font-weight:700}
  .name{font-weight:600}
  .meta{color:var(--muted);font-size:13px}
  .desc{color:var(--muted);font-size:14px;margin:0}
  .tag{align-self:flex-start;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .empty{color:var(--muted);padding:40px 0;text-align:center}
  footer{max-width:1080px;margin:auto;padding:0 24px 40px;color:var(--muted);font-size:13px}
  a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>MiniAppHub</h1>
  <p>Каталог HTML5-мини-приложений. Установка в оболочку <a href="https://github.com/MiniAppHub/appshell">appshell</a>, публикация через <a href="https://github.com/MiniAppHub/template">template</a>.</p>
</header>
<main>
  <input id="q" class="search" type="search" placeholder="Поиск по названию или автору…" aria-label="Поиск">
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>Ничего не найдено</div>
</main>
<footer>
  Реестр: <a href="catalog.json">catalog.json</a> · Версии клиентов: <a href="versions.json">versions.json</a> · Бесплатный хостинг на GitHub Pages
</footer>
<script type="module">
  const grid = document.getElementById('grid');
  const q = document.getElementById('q');
  const empty = document.getElementById('empty');
  let apps = [];

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function render(list) {
    grid.innerHTML = list.map(a => `
      <a class="app" href="${esc(a.url)}" target="_blank" rel="noopener">
        <div class="top">
          <div class="ico">${esc((a.name || '?')[0].toUpperCase())}</div>
          <div>
            <div class="name">${esc(a.name)}</div>
            <div class="meta">${esc(a.author)} · v${esc(a.version)}</div>
          </div>
        </div>
        <p class="desc">${esc(a.description)}</p>
        <span class="tag">${esc(a.id)}</span>
      </a>`).join('');
    empty.hidden = list.length > 0;
  }

  try {
    const res = await fetch('catalog.json', { cache: 'no-cache' });
    const data = await res.json();
    apps = data.apps || [];
  } catch (e) {
    empty.textContent = 'Не удалось загрузить каталог';
    empty.hidden = false;
  }
  render(apps);

  q.addEventListener('input', () => {
    const t = q.value.trim().toLowerCase();
    render(apps.filter(a => [a.name, a.author, a.description, a.id].some(v => String(v || '').toLowerCase().includes(t))));
  });
</script>
</body>
</html>
